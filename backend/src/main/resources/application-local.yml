# Developer machine. Defaults match docker-compose.yml so `mvnw spring-boot:run` works with no env vars.
# These credentials are for local containers only and must never be reused elsewhere.

server:
  port: ${SERVER_PORT:8085}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  jpa:
    hibernate:
      ddl-auto: none
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-twilight-unit-b5x29nnp-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_xuI7sGtrVKy9}
    hikari:
      connection-timeout: 30000
      keepalive-time: 30000
      max-lifetime: 600000

  data:
    redis:
      password: ${REDIS_PASSWORD:bos_redis_local_dev}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.pawanputra.bos: ${APP_LOG_LEVEL:DEBUG}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-only-jwt-signing-key-do-not-use-anywhere-else}
    auth:
      cookie-secure: ${AUTH_COOKIE_SECURE:false}
    # Local sign-in for a fresh database. Local profile only; change the password after first login if you share the DB.
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@pawanputra.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:LocalDevAdmin#2026}
  storage:
    provider: ${STORAGE_PROVIDER:cloudinary}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:bos-local}
    access-key: ${STORAGE_ACCESS_KEY:bos_minio}
    secret-key: ${STORAGE_SECRET_KEY:bos_minio_local_dev}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:instagram-news}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash}
      enabled: ${GEMINI_ENABLED:true}
  integration:
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
      from-email: ${SENDGRID_FROM_EMAIL:noreply@pawanputra.com}
      from-name: ${SENDGRID_FROM_NAME:Pawan Putra Business OS}
    whatsapp:
      provider: ${WHATSAPP_PROVIDER:twilio}
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_WHATSAPP_FROM:}
      meta:
        phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
        access-token: ${WHATSAPP_ACCESS_TOKEN:}
